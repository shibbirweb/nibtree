[package]
name = "nibtree"
version = "0.1.0-beta.12"
description = "Native Git GUI with a 3-way merge tool"
authors = ["MD. Shibbir Ahmed"]
homepage = "https://github.com/shibbirweb/nibtree"
repository = "https://github.com/shibbirweb/nibtree"
license = "MIT"
edition = "2021"

# The command line tool is its own crate (cli/), so Windows can ship it as a console program.
[workspace]
members = ["cli", "macros", "browser"]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "nibtree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nibtree-cli = { path = "cli" }
nibtree-macros = { path = "macros" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
imara-diff = "0.2.0"
notify-debouncer-full = "0.7.0"
# Reads only: network/auth features are unnecessary because writes go through the git CLI.
git2 = { version = "0.21.0", default-features = false }
tauri-plugin-opener = "2"
portable-pty = "0.9.0"
# Go to File: the ripgrep walker (respects .gitignore) and Helix's fuzzy matcher.
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
# Find in Files: ripgrep's search libraries over the same file list.
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
memchr = "2.7.4"
# GitHub API and the AI usage readers: a small blocking client on the system TLS stack (Security.framework on macOS),
# so no async runtime, rustls or ring end up in the binary. It must be "native-tls", not "native-tls-no-default":
# ureq checks for that exact feature before every HTTPS request and panics without it (which aborts the app).
# Certificates are still checked against the system's roots (RootCerts::PlatformVerifier in github/http.rs).
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
# MCP server: the HTTP/1.1 request parser ureq already uses. The server loop is ours, so it can cap
# connections and stop every thread when switched off (tiny_http keeps idle keep-alive threads).
httparse = "1"
# The MCP token's random bytes and the screenshot's base64: both already in the tree through tauri.
getrandom = "0.3"
base64 = "0.22"
# Real paths without the `\\?\` prefix on Windows (see paths.rs); already in the tree through tauri.
dunce = "1.0.5"
# Local History: snapshots are zlib-compressed (flate2 and miniz_oxide are already in the tree through tauri's png).
flate2 = "1.1"
# Files panel: Move to Trash (NSFileManager on macOS, the Recycle Bin on Windows, freedesktop trash on Linux).
# The default "chrono" feature only dates Linux trash listings, which the app never reads.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(unix)'.dependencies]
# Signals the whole process group of a terminal shell on close.
libc = "0.2"

# The GitHub token lives only in the system keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
# The MCP screenshot reads the window number of the app's NSWindow (already in the tree through tauri).
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# Windows starts a new copy of the app for every launch; this hands its arguments to the running one.
tauri-plugin-single-instance = "2"
# Cancel stops git and everything it started through a Job Object (git/cancel.rs); already in the tree.
# The MCP screenshot draws the window with PrintWindow and crops it to its DWM frame (mcp/host.rs);
# the memory readout walks the WebView2 processes and reads their private working set (memory.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Wdk_System_Threading",
    # Keep computer awake (keep_awake.rs): SetThreadExecutionState.
    "Win32_System_Power",
] }

[dev-dependencies]
tempfile = "3.27.0"

# Go to File matches on every keystroke: keep the matcher fast in dev builds too.
[profile.dev.package.nucleo-matcher]
opt-level = 3

# Find in Files and the symbol scan read whole trees: keep them fast in dev builds too.
[profile.dev.package.grep-searcher]
opt-level = 3

[profile.dev.package.grep-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# Small, fast binary: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

