[package]
# `nibtree-browser`: the whole app in a browser tab, served from this machine (npx nibtree).
# Its version stays 0.0.0: the app's version lives in ../Cargo.toml (scripts/version.ts).
name = "nibtree-browser"
version = "0.0.0"
description = "Nibtree in the browser: a local server for the app's page and commands"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
nibtree = { path = ".." }
nibtree-cli = { path = "../cli" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "original-uri"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
open = "5"
