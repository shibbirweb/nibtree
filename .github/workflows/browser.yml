# The browser version (npx nibtree) on all six platforms it ships for. Each one builds nibtree-browser, runs the
# browser version's tests, packs its npm packages (scripts/npm-package.ts) and smoke tests them the way npm
# installs them (scripts/browser-smoke.ts), with Bun and with Node, which is what `npx nibtree` runs on.
#
# release.yml calls this for every beta and stable release with `publish: true`: the programs are then built in
# release mode and published to npm, betas under the `next` tag and stable versions under `latest`. Publishing
# needs the repository secret NPM_TOKEN (Settings, Secrets and variables, Actions): an npm granular access token
# with read and write access to `nibtree` and the `@nibtree` scope. Without it the packages get a dry run and
# nothing is published. A version already on npm is skipped, so rebuilding a release is safe.
name: Browser version

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build, like v0.2.0-beta.1
        type: string
        required: true
      publish:
        description: Build in release mode and publish the packages to npm
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  platform:
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { title: macOS arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { title: macOS x64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { title: Linux x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { title: Linux arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { title: Windows x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { title: Windows arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      PROFILE: ${{ inputs.publish && 'release' || 'debug' }}
      EXE: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Only to run the launcher the way `npx nibtree` does; the repository's own tools run on Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: browser-${{ matrix.target }}-${{ inputs.publish && 'release' || 'debug' }}

      # The app crate still links Tauri, which needs these to build and WebKitGTK to run on Linux.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version agrees in every file
        run: bun scripts/version.ts check

      - name: Build the page
        run: bun run build

      - name: Page tests of the browser version
        run: bun --bun vitest run src/lib/browser src/lib/menu/pageMenu.test.ts scripts/npmPackages.test.ts \
          scripts/tarball.test.ts

      - name: Rust tests of the browser version
        if: ${{ !inputs.publish }}
        working-directory: src-tauri
        run: |
          cargo test --locked -p nibtree-browser
          cargo test --locked -p nibtree --lib -- browser:: commands::browse::

      - name: Build nibtree-browser
        working-directory: src-tauri
        run: cargo build --locked -p nibtree-browser ${{ inputs.publish && '--release' || '' }}

      - name: Pack the npm packages
        run: |
          bun scripts/npm-package.ts pack --target ${{ matrix.target }} \
            --binary "src-tauri/target/$PROFILE/nibtree-browser$EXE" --page build --out npm-packages

      - name: Smoke test with Bun
        run: bun scripts/browser-smoke.ts --packages npm-packages

      - name: Smoke test with Node
        run: bun scripts/browser-smoke.ts --packages npm-packages --runtime node

      - name: Keep the packages for publishing
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm-packages/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: platform
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Every platform packed the same launcher; one copy is kept.
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-packages
          merge-multiple: true

      - name: Publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "::warning::There is no NPM_TOKEN secret, so the packages only got a dry run. See browser.yml."
            bun scripts/npm-package.ts publish --dir npm-packages --dry-run
          else
            bun scripts/npm-package.ts publish --dir npm-packages
          fi
