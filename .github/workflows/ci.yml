# Tests every push to develop (the beta line) and master (stable), and every pull request.
#
# Passing CI on a push is also what moves a release along: beta-publish.yml, stable-promote.yml and
# stable-publish.yml each start when this finishes, and only act on a run that passed.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  # release.yml calls this before building a release it was handed by hand.
  workflow_call:
  # beta.yml and stable.yml start this on the release branch they push. A pull request opened with the
  # built in token starts no workflow, so without it the release pull request would have no checks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (check + Vitest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version agrees in every file
        run: bun scripts/version.ts check

      - name: File icon sets are up to date
        run: bun scripts/file-icons.ts --check

      - name: Formatted with Prettier
        run: bun run format:check

      - name: Type-check (svelte-check)
        run: bun run check

      - name: Unit tests (Vitest)
        run: bun run test

      # Every feature has its usage page, developer chapter and screenshots, and every link works.
      - name: Wiki docs are complete
        run: bun scripts/build-wiki.ts --check

  rust:
    name: Rust (cargo test + clippy)
    # The backend has macOS-only code (memory readout) and the app targets macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds the frontend build output, so it must exist.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Tests
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  swift-ui:
    name: Swift UI library (build, test)
    # The SwiftUI components (ui/swift) that the native app is built from; the tokens they use are checked fresh by
    # the frontend job's Vitest run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Every Swift component has a ui/web twin and a story
        run: |
          bun install --frozen-lockfile
          bun run ui:swift:coverage --check

      - name: Build
        working-directory: ui/swift
        run: swift build -Xswiftc -warnings-as-errors

      - name: Tests
        run: sh ui/swift/scripts/test.sh

      - name: Every story renders
        working-directory: ui/swift
        run: swift run NibtreeShowcase --render "$RUNNER_TEMP/stories"

  # Every component matches its ui/web twin to at least 99% in light and dark, and renders faster. Match and speed
  # run as two jobs beside the build, so the gate takes the time of the slower one; the speed job also times on a
  # runner that is not taking pictures at the same time.
  swift-parity:
    name: Swift UI parity (${{ matrix.check }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        check: [match, speed]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Parity with ui/web (${{ matrix.check }})
        run: |
          bun install --frozen-lockfile
          bunx --bun playwright install webkit
          bun run ui:swift:parity --${{ matrix.check }}

      - name: Keep the parity pictures when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-parity-${{ matrix.check }}
          path: ui/swift/.parity
          # .parity starts with a dot, and upload-artifact skips hidden folders unless told.
          include-hidden-files: true

  # Windows runs as two jobs, like macOS, so the frontend checks and the slower Rust build run side by side.
  windows-frontend:
    name: Windows frontend (check + Vitest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git turns LF into CRLF on checkout, which breaks the shell scripts and the tests that
      # compare file bytes.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Both run even when the other failed, so one run lists every Windows failure.
      - name: Type-check (svelte-check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check

      - name: Unit tests (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test

  windows-rust:
    name: Windows Rust (cargo test + clippy)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds the frontend build output, so it must exist.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        id: build
        run: |
          bun install --frozen-lockfile
          bun run build

      # Clippy runs even when a test failed, so one run lists every Windows failure.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked --workspace --no-fail-fast

      - name: Clippy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
